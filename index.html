<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0b0f17">
<title>모의 주식 투자</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="toasts" class="toasts"></div>

<!-- 입장 -->
<div id="joinView" class="join hidden">
  <div class="box">
    <div class="logo">📈</div>
    <h1 id="joinTitle">모의 주식 투자</h1>
    <p class="muted">닉네임을 정하고 입장해줘</p>
    <form id="joinForm" style="margin-top:22px">
      <input id="joinName" maxlength="12" placeholder="닉네임 (최대 12자)" autocomplete="off" style="text-align:center;font-size:18px;font-weight:700">
      <button class="btn primary big" style="margin-top:12px" id="joinBtn">입장하기</button>
    </form>
    <p id="joinMsg" class="small" style="color:var(--up);min-height:20px;margin-top:12px"></p>
  </div>
</div>

<div id="loading" class="join"><div class="box"><div class="logo">⏳</div><p class="muted" id="loadMsg">연결 중…</p></div></div>

<!-- 메인 -->
<div id="appView" class="app hidden">
  <div class="top">
    <div class="top-row">
      <div style="display:flex;gap:6px;align-items:center;min-width:0">
        <span class="chip" id="statusChip">대기 중</span>
        <span class="chip" id="rankChip">-위</span>
      </div>
      <span class="chip num" id="timeChip">--:--</span>
    </div>
    <div class="muted small" style="margin-top:8px"><span id="meName"></span> · 총자산</div>
    <div class="worth num" id="worth">0원</div>
    <div class="worth-sub num">
      <span id="worthPl">±0</span>
      <span>현금 <b id="cash" style="color:var(--text)">0</b></span>
      <span>주식 <b id="stockVal" style="color:var(--text)">0</b></span>
    </div>
  </div>
  <div id="alerts"></div>
  <div class="newsbar" id="newsbar"><b>📰 속보</b><span id="newsText" class="muted">아직 속보 없음</span></div>

  <!-- 시장 -->
  <div id="tab-market" class="section">
    <div class="card" style="padding:4px 12px" id="stockList"></div>
    <p class="muted small" style="text-align:center;margin-top:10px">종목을 누르면 차트랑 매수/매도 화면이 나와</p>
  </div>

  <!-- 내 자산 -->
  <div id="tab-me" class="section hidden">
    <div id="effects" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px"></div>
    <h3>보유 주식</h3>
    <div class="card" style="padding:4px 12px" id="holdList"></div>
    <h3 style="margin-top:20px">아이템</h3>
    <div class="items" id="itemList"></div>
    <p class="muted small" style="margin-top:10px">퀴즈를 맞히거나 결투에서 이기면 아이템을 얻어.</p>
  </div>

  <!-- 아레나 -->
  <div id="tab-arena" class="section hidden">
    <div id="arenaMain"></div>
    <h3 style="margin-top:20px">진행 중인 결투</h3>
    <div id="duelList" class="card" style="padding:8px 12px"></div>
  </div>

  <!-- 랭킹 -->
  <div id="tab-rank" class="section hidden">
    <div id="finalBanner"></div>
    <div class="card" style="padding:4px 10px" id="rankList"></div>
  </div>

  <nav class="tabs">
    <button data-tab="market" class="on"><span class="ic">📈</span>시장</button>
    <button data-tab="me"><span class="ic">💼</span>내 자산</button>
    <button data-tab="arena"><span class="ic">⚔️</span>아레나<i class="pip hidden" id="arenaPip"></i></button>
    <button data-tab="rank"><span class="ic">🏆</span>랭킹</button>
  </nav>
</div>

<!-- 종목 상세 -->
<div id="sheetBg" class="sheet-bg hidden"></div>
<div id="sheet" class="sheet hidden">
  <div class="grab"></div>
  <div style="display:flex;justify-content:space-between;align-items:flex-start">
    <div>
      <div style="font-size:20px;font-weight:900" id="sName"></div>
      <div class="muted small" id="sSec"></div>
    </div>
    <div style="text-align:right">
      <div class="num" style="font-size:24px;font-weight:900" id="sPrice"></div>
      <div class="num small" id="sChg"></div>
    </div>
  </div>
  <div class="seg" style="margin-top:12px" id="rangeSeg">
    <button data-r="150" class="on">5분</button><button data-r="450">15분</button><button data-r="0">전체</button>
  </div>
  <canvas class="chart" id="sChart" style="margin-top:8px"></canvas>
  <div class="card" style="margin-top:10px;padding:10px 14px" id="sHold"></div>
  <div class="seg" style="margin-top:12px" id="sideSeg">
    <button data-side="buy" class="on buy">매수</button><button data-side="sell">매도</button>
  </div>
  <div style="margin-top:10px;display:flex;gap:8px;align-items:center">
    <input id="qty" type="number" inputmode="numeric" min="1" placeholder="수량" class="num" style="font-size:18px;font-weight:800">
    <span class="muted">주</span>
  </div>
  <div class="qrow" id="qBtns"></div>
  <div style="margin-top:10px" id="est"></div>
  <button class="btn big buy" style="margin-top:12px" id="tradeBtn">매수하기</button>
  <button class="btn ghost big" style="margin-top:8px" id="closeSheet">닫기</button>
</div>

<!-- 퀴즈 -->
<div id="quizModal" class="modal-bg hidden">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span class="chip" style="background:var(--gold);color:#2a1e00">🧠 퀴즈 <span id="qNo"></span></span>
      <span class="chip num" id="qTime"></span>
    </div>
    <div class="timer"><div id="qBar"></div></div>
    <div class="quiz-q" id="qText"></div>
    <div id="qOpts"></div>
    <form id="qForm" class="hidden" style="display:flex;gap:8px">
      <input id="qInput" placeholder="정답 입력" autocomplete="off">
      <button class="btn primary" style="flex:none">제출</button>
    </form>
    <p class="muted small" style="text-align:center;margin:12px 0 0">맞히면 아이템을 받아! 기회는 한 번뿐</p>
    <button class="btn ghost" style="width:100%;margin-top:10px" id="qSkip">나중에 (창 닫기)</button>
  </div>
</div>

<div id="confirmModal" class="modal-bg hidden">
  <div class="modal">
    <div style="font-size:18px;font-weight:800" id="cfText"></div>
    <div style="display:flex;gap:8px;margin-top:18px">
      <button class="btn ghost" style="flex:1" id="cfNo">취소</button>
      <button class="btn primary" style="flex:1" id="cfYes">확인</button>
    </div>
  </div>
</div>

<div id="newsFlash" class="newsflash hidden"><div class="box"><div class="lab">📰 속보 BREAKING</div><div class="tx" id="nfText"></div><div class="small" style="margin-top:10px;opacity:.85" id="nfSub"></div></div></div>

<script type="module" src="player.js"></script>
</body>
</html>
